name: Publish Nrt.Native

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.0)'
        required: true
        type: string
        default: '1.0.0'

env:
  DOTNET_VERSION: '9.0.x'
  PACKAGE_PROJECT: Nrt.Native/Nrt.Native.csproj
  GITHUB_FEED: https://nuget.pkg.github.com/yny-godigital/index.json

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate native DLLs (real binaries, not LFS pointers)
        run: |
          count=$(ls Nrt.Native/runtimes/win-x64/native/*.dll 2>/dev/null | wc -l)
          if [ "$count" -lt 20 ]; then
            echo "::error::Only $count native DLLs found — expected 20+. Place the NRT runtime DLLs in Nrt.Native/runtimes/win-x64/native/ and commit them, then re-run."
            exit 1
          fi
          if head -1 Nrt.Native/runtimes/win-x64/native/*.dll 2>/dev/null | grep -q "git-lfs"; then
            echo "::error::DLLs are git LFS pointers instead of real binaries. Run 'git lfs pull' before packing."
            exit 1
          fi
          echo "✅ $count native DLLs present (real binaries)"

      - name: Build NrtSdk.dll from source
        run: |
          dotnet build Nrt.Native/src/NrtSdk/NrtSdk.csproj -c Release
          mkdir -p Nrt.Native/lib/net9.0/
          cp Nrt.Native/src/NrtSdk/bin/Release/net9.0/NrtSdk.dll Nrt.Native/lib/net9.0/


      - name: Update version in csproj
        run: |
          sed -i "s|<Version>.*</Version>|<Version>${{ inputs.version }}</Version>|" \
            "${{ env.PACKAGE_PROJECT }}"

      - name: Pack
        run: dotnet pack "${{ env.PACKAGE_PROJECT }}" -c Release -o .

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push Nrt.Native.${{ inputs.version }}.nupkg \
            --source "${{ env.GITHUB_FEED }}" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
