name: Publish Nrt5.Native

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [validate, publish]
        default: validate
        required: true
      version:
        type: string
        required: true
      validation_run_id:
        type: string
        description: "Required for action=publish: run ID of the successful validate run for this version"
      permission_reference:
        type: string
        description: "Optional. Approval or change-record ID"
      smoke_reference:
        type: string
        description: "Optional. Pointer to the Windows smoke-test evidence"
      smoke_package_sha256:
        type: string
        description: "Optional. SHA-256 of Nrt5.Native.<version>.nupkg produced by the validate run"

permissions:
  contents: read

env:
  DOTNET_VERSION: 9.0.x
  VERSION: ${{ inputs.version }}
  GITHUB_FEED: https://nuget.pkg.github.com/yny-godigital/index.json

jobs:
  build:
    if: inputs.action == 'validate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check version and retrieve native assets
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          git lfs pull --include='Nrt5.Native/runtimes/win-x64/native/*' --exclude=''
          python Nrt5.Native/tests/check_assets.py inputs
      - name: Build and check package
        run: |
          dotnet pack Nrt5.Native/Nrt5.Native.csproj -c Release -p:PackageVersion="$VERSION" -o artifacts
          python Nrt5.Native/tests/check_assets.py package "artifacts/Nrt5.Native.$VERSION.nupkg" --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: nrt5-candidate
          path: artifacts/*.nupkg
          compression-level: 0
          retention-days: 14

  consumer:
    if: inputs.action == 'validate'
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: nrt5-candidate
          path: artifacts
      - name: Check candidate and consumer output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NUGET_PACKAGES = "$env:RUNNER_TEMP/nrt5-nuget"
          $project = 'Nrt5.Native/tests/Consumer/Consumer.csproj'
          python Nrt5.Native/tests/check_assets.py package "artifacts/Nrt5.Native.$env:VERSION.nupkg" --version $env:VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet restore $project -p:Nrt5PackageVersion=$env:VERSION --source https://api.nuget.org/v3/index.json --source "$env:GITHUB_WORKSPACE/artifacts"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build $project -c Release -p:Nrt5PackageVersion=$env:VERSION --no-restore
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python Nrt5.Native/tests/check_assets.py output Nrt5.Native/tests/Consumer/bin/Release/net9.0/win-x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish $project -c Release -p:Nrt5PackageVersion=$env:VERSION --no-restore -o artifacts/publish
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python Nrt5.Native/tests/check_assets.py output artifacts/publish
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet artifacts/publish/Consumer.dll
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  publish:
    if: inputs.action == 'publish'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.validation_run_id }}
      PERMISSION_REFERENCE: ${{ inputs.permission_reference }}
      SMOKE_REFERENCE: ${{ inputs.smoke_reference }}
      SMOKE_SHA256: ${{ inputs.smoke_package_sha256 }}
    steps:
      - name: Check release evidence and select the validated source
        id: candidate
        run: |
          set -euo pipefail
          fail=0

          if [[ ! "${VERSION:-}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version '${VERSION:-}' is not semver X.Y.Z[-pre]"; fail=1
          fi

          # required for publish: both the candidate artifact and the checkout ref come from this run
          if [[ ! "${RUN_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::validation_run_id is required when action=publish - it names the validate run that built nrt5-candidate"; fail=1
          fi

          # optional evidence: format is checked only when a value is supplied
          if [[ -n "${SMOKE_SHA256:-}" && ! "$SMOKE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::smoke_package_sha256 must be 64 hex chars (was ${#SMOKE_SHA256})"; fail=1
          fi

          # no API call or output write happens until the inputs are known good
          [[ "$fail" -eq 0 ]] || exit 1

          for v in PERMISSION_REFERENCE SMOKE_REFERENCE SMOKE_SHA256; do
            [[ -n "${!v:-}" ]] || echo "::notice::$v not supplied - recorded as absent in the release evidence"
          done

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/nrt5-run.json"
          jq -e '.conclusion == "success" and .event == "workflow_dispatch" and .path == ".github/workflows/publish-nrt5-native.yml"' "$RUNNER_TEMP/nrt5-run.json"
          echo "sha=$(jq -r .head_sha "$RUNNER_TEMP/nrt5-run.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: nrt5-candidate
          path: artifacts
          run-id: ${{ inputs.validation_run_id }}
          github-token: ${{ github.token }}
      - name: Check exact candidate and redistribution terms
        run: |
          set -euo pipefail
          test -s Nrt5.Native/LICENSE.txt
          package="artifacts/Nrt5.Native.$VERSION.nupkg"
          if [[ -n "${SMOKE_SHA256:-}" ]]; then
            echo "$SMOKE_SHA256  $package" | sha256sum --check
          else
            echo "::notice::smoke_package_sha256 not supplied - candidate hash not verified against smoke evidence"
          fi
          python Nrt5.Native/tests/check_assets.py package "$package" --version "$VERSION"
          printf 'Validation run: %s\nPermission: %s\nWindows smoke test: %s\nPackage SHA-256: %s\n' \
            "$RUN_ID" "${PERMISSION_REFERENCE:-not supplied}" "${SMOKE_REFERENCE:-not supplied}" "${SMOKE_SHA256:-not supplied}" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the validated artifact
        run: |
          dotnet nuget push "artifacts/Nrt5.Native.$VERSION.nupkg" \
            --source "$GITHUB_FEED" --api-key "$GH_TOKEN" --skip-duplicate
