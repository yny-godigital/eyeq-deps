name: Publish Nrt5.Native

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true

env:
  DOTNET_VERSION: 9.0.x
  VERSION: ${{ inputs.version }}
  GITHUB_FEED: https://nuget.pkg.github.com/yny-godigital/index.json

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and publish
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          git lfs pull --include='Nrt5.Native/runtimes/win-x64/native/*' --exclude=''
          dotnet pack Nrt5.Native/Nrt5.Native.csproj -c Release -p:PackageVersion="$VERSION" -o artifacts
          dotnet nuget push "artifacts/Nrt5.Native.$VERSION.nupkg" \
            --source "$GITHUB_FEED" --api-key "$GITHUB_TOKEN" --skip-duplicate
