name: Publish Nrt5.Native

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 5.0.3)'
        required: true
        type: string
        default: '5.0.3'

env:
  DOTNET_VERSION: '9.0.x'
  PACKAGE_PROJECT: Nrt5.Native/Nrt5.Native.csproj
  GITHUB_FEED: https://nuget.pkg.github.com/yny-godigital/index.json

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate native DLLs (real binaries, not LFS pointers)
        run: |
          count=$(ls Nrt5.Native/runtimes/win-x64/native/*.dll 2>/dev/null | wc -l)
          if [ "$count" -lt 15 ]; then
            echo "::error::Only $count native DLLs found — expected 15+. Place the NRT v5 runtime DLLs in Nrt5.Native/runtimes/win-x64/native/ and commit them, then re-run."
            exit 1
          fi
          if head -1 Nrt5.Native/runtimes/win-x64/native/*.dll 2>/dev/null | grep -q "git-lfs"; then
            echo "::error::DLLs are git LFS pointers instead of real binaries. Run 'git lfs pull' before packing."
            exit 1
          fi
          echo "OK: $count native DLLs present (real binaries)"

      - name: Update version in csproj
        run: |
          sed -i "s|<Version>.*</Version>|<Version>${{ inputs.version }}</Version>|" \
            "${{ env.PACKAGE_PROJECT }}"

      - name: Pack
        run: dotnet pack "${{ env.PACKAGE_PROJECT }}" -c Release -o .

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push Nrt5.Native.${{ inputs.version }}.nupkg \
            --source "${{ env.GITHUB_FEED }}" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
