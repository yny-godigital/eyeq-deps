name: Publish Nrt5.Native

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 5.0.3)'
        required: true
        type: string
        default: '5.0.3'

env:
  DOTNET_VERSION: '9.0.x'
  PACKAGE_PROJECT: Nrt5.Native/Nrt5.Native.csproj
  NATIVE_DIR: Nrt5.Native/runtimes/win-x64/native
  GITHUB_FEED: https://nuget.pkg.github.com/yny-godigital/index.json

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pull NRT v5 native DLLs from LFS
        run: git lfs pull --include='Nrt5.Native/runtimes/win-x64/native/*'

      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' — expected e.g. 5.0.3 or 5.0.3-beta.1."
            exit 1
          fi

      - name: Validate native DLLs (real binaries, not LFS pointers)
        run: |
          count=$(find "$NATIVE_DIR" -maxdepth 1 -iname '*.dll' | wc -l)
          if [ "$count" -lt 15 ]; then
            echo "::error::Only $count native DLLs found in $NATIVE_DIR — expected 15+. Place the NRT v5 runtime DLLs there and commit them, then re-run."
            exit 1
          fi
          if grep -l 'git-lfs' "$NATIVE_DIR"/* >/dev/null 2>&1; then
            echo "::error::DLLs are git LFS pointers instead of real binaries. Run 'git lfs pull' before packing."
            exit 1
          fi
          echo "OK: $count native DLLs present (real binaries)"

      - name: Pack
        run: |
          dotnet pack "$PACKAGE_PROJECT" -c Release -p:PackageVersion="$VERSION" -o artifacts
          package="artifacts/Nrt5.Native.$VERSION.nupkg"
          unzip -l "$package" | grep -q 'lib/net9.0/Nrt5Sdk.dll' \
            || { echo "::error::$package is missing lib/net9.0/Nrt5Sdk.dll"; exit 1; }
          packed=$(unzip -Z1 "$package" | grep -ci '^runtimes/win-x64/native/.*\.dll$')
          if [ "$packed" -lt 15 ]; then
            echo "::error::$package contains only $packed native DLLs — expected 15+."
            exit 1
          fi
          echo "OK: $package contains Nrt5Sdk.dll and $packed native DLLs"

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "artifacts/Nrt5.Native.$VERSION.nupkg" \
            --source "${{ env.GITHUB_FEED }}" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
